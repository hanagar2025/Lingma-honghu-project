name: CI

on:
  push:
    branches: [ main ]
  # 不限定 base 分支：叠在别的 PR 之上的 PR，base 不是 main，限定后会一次检查都不跑
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + selftest + regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-20-${{ hashFiles('package-lock.json') }}
      - name: Install (workspaces)
        run: npm ci --no-audit --progress=false
      - name: Typecheck
        run: npm -w backend run typecheck
      # 守：数据核对不通过不出股数；顺序 C 级清退 → 单票归位 → 熔断；熔断待核验不进执行列表也不消失；
      # 决策输入只由账本和持仓价格算出；主线外持仓只提示、不出指令。
      - name: Daily decision selftest (执行单)
        run: npm -w backend run decision:daily:selftest
      # 守：认不出的文字不猜；识别结果必须过勾稽核对；图片不经确认不生效；成交不改账本。
      - name: Intake selftest (输入框)
        run: npm -w backend run intake:selftest

      - name: Auth selftest (登录)
        run: npm -w backend run auth:selftest

      - name: Insight selftest (简报、记分牌、定时推送、自动识别)
        run: npm -w backend run insight:selftest
      # 守：名单同 scripts/ai-mainline-map.py 一致；数据只增不改；给 bot 的只有占比和指数；
      # bot 口令读不到账本；决定只有策略方能写、否决只有委员会能做；脚本原样调用。
      - name: Chain selftest (链上数据、盯线、定时汇总留存)
        run: npm -w backend run chain:selftest
      - name: Chain universe matches scripts/ai-mainline-map.py
        run: python3 scripts/chain-universe.py --check
      # 生产分支上已经发出的执行单，现在的代码必须逐字重现。
      # 有意修改执行单版式时这一步会失败，那时须在 PR 里写明改了什么。
      - name: Historical card regression (历史执行单逐字重现)
        run: |
          git fetch --no-tags origin cursor/account-snapshot-1009-c819
          npm -w backend run decision:regress -- FETCH_HEAD
      # 打印规则指纹并与基线比对。变动时不失败，变动只需在基线文件的 git diff 里显形。
      - name: Rule freeze check (规则指纹)
        run: npm -w backend run freeze:check
      - name: Source lint (变量花括号 + 严格模式 + 界面文案无 Markdown 星号)
        run: node scripts/lint-source.mjs
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done

  frontend:
    name: Frontend (typecheck + build + package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-20-${{ hashFiles('package-lock.json') }}
      - name: Install (workspaces)
        run: npm ci --no-audit --progress=false
      - name: Typecheck
        run: npm -w frontend run typecheck
      - name: Build
        run: npm -w frontend run build
      # 发布包必须不靠仓库里的 node_modules 自己跑起来：服务器上没有 npm。
      - name: Package + smoke (发布包试跑)
        run: node scripts/package-server.mjs --smoke

  digest-bot:
    name: Digest bot (typecheck + selftest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/honghu-digest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22-${{ hashFiles('agents/honghu-digest/package-lock.json') }}
      - name: Install
        run: npm ci --no-audit --progress=false
      - name: Typecheck
        run: npm run check
      # 守：打分照 half-year-plan 第二节；S1–S5 只读脚本的 triggers；汇总里没有股数和金额；休市不出；
      # 五个定时任务换成北京时间是 08:40、11:40、16:20、16:40、周五 16:50。全部离线，不需要任何口令。
      - name: Selftest (打分、规则核对、五份汇总)
        run: npm run selftest
      - name: Project layout (agent-sdk validate)
        run: npm run validate
