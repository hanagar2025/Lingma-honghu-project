name: CI

on:
  push:
    branches: [ main ]
  # 不限定 base 分支：叠在别的 PR 之上的 PR（stacked PR）base 不是 main，
  # 若限定 branches: [main]，这类 PR 会**一次检查都不跑**而界面上只显示"无检查"。
  # 与今天修掉的两处同类：一个不运行的守卫和没有守卫是一回事。
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + selftest + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-20-${{ hashFiles('package-lock.json') }}
      - name: Install (workspaces)
        run: |
          npm ci --workspaces --include-workspace-root --prefer-offline --no-audit --progress=false || \
          npm install --workspaces --include-workspace-root --legacy-peer-deps
      # 用工作区自己的 script，而不是 npx --workspace + -p 路径：
      # 后者会把 cwd 切到 backend/ 却仍按仓库根解析 backend/tsconfig.json，
      # 结果 typecheck 一直以 TS5058 失败，**后面的自检步骤从未执行过**。
      # 一个不运行的守卫和没有守卫是一回事。
      - name: Typecheck
        run: npm -w backend run typecheck
      - name: TIOS engine selftest
        run: npm -w backend run tios:selftest
      - name: MSR radar selftest (执行债务闸门不变量)
        run: npm -w backend run msr:selftest
      # 驾驶舱自检守的是"观察指标不得产生动作"这条不变量。
      # 它必须在 CI 里跑 —— 否则该约束只是注释里的一句承诺。
      - name: Cockpit selftest (观察指标不得产生动作)
        run: npm -w backend run cockpit:selftest
      # 守两条：规则漂移必须能被发现；E3 不得用盈亏评判模型。
      - name: Governance selftest (规则指纹 + E3不用盈亏)
        run: npm -w backend run audit:selftest
      # 守：研究域与决策域永不相交；加研究标的不得改变规则指纹；利润数据不得插值。
      - name: Research selftest (研究域不得进入决策域)
        run: npm -w backend run research:selftest
      # 打印规则指纹并与冻结基线比对。漂移时**不失败** —— 否则会有人顺手更新基线
      # 让 CI 变绿，把审计变成盖章。漂移只需在基线文件的 git diff 里显形即可。
      - name: Rule freeze check (打印指纹，漂移不失败)
        run: npm -w backend run freeze:check
      - name: Run backend tests
        run: npm -w backend run test -- --coverage

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-20-${{ hashFiles('package-lock.json') }}
      - name: Install (workspaces)
        run: |
          npm ci --workspaces --include-workspace-root --prefer-offline --no-audit --progress=false || \
          npm install --workspaces --include-workspace-root --legacy-peer-deps
      - name: Typecheck
        run: npm -w frontend run typecheck
      - name: Build
        run: npm -w frontend run build
