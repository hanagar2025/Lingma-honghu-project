name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (typecheck + selftest + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-20-${{ hashFiles('package-lock.json') }}
      - name: Install (workspaces)
        run: |
          npm ci --workspaces --include-workspace-root --prefer-offline --no-audit --progress=false || \
          npm install --workspaces --include-workspace-root --legacy-peer-deps
      # 用工作区自己的 script，而不是 npx --workspace + -p 路径：
      # 后者会把 cwd 切到 backend/ 却仍按仓库根解析 backend/tsconfig.json，
      # 结果 typecheck 一直以 TS5058 失败，**后面的自检步骤从未执行过**。
      # 一个不运行的守卫和没有守卫是一回事。
      - name: Typecheck
        run: npm -w backend run typecheck
      - name: TIOS engine selftest
        run: npm -w backend run tios:selftest
      - name: MSR radar selftest (执行债务闸门不变量)
        run: npm -w backend run msr:selftest
      # 驾驶舱自检守的是"观察指标不得产生动作"这条不变量。
      # 它必须在 CI 里跑 —— 否则该约束只是注释里的一句承诺。
      - name: Cockpit selftest (观察指标不得产生动作)
        run: npm -w backend run cockpit:selftest
      - name: Run backend tests
        run: npm -w backend run test -- --coverage

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-20-${{ hashFiles('package-lock.json') }}
      - name: Install (workspaces)
        run: |
          npm ci --workspaces --include-workspace-root --prefer-offline --no-audit --progress=false || \
          npm install --workspaces --include-workspace-root --legacy-peer-deps
      - name: Typecheck
        run: npm -w frontend run typecheck
      - name: Build
        run: npm -w frontend run build
