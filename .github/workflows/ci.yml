name: CI

on:
  push:
    branches: [ main ]
  # 不限定 base 分支：叠在别的 PR 之上的 PR，base 不是 main，限定后会一次检查都不跑
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + selftest + regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-20-${{ hashFiles('package-lock.json') }}
      - name: Install (workspaces)
        run: npm ci --no-audit --progress=false
      - name: Typecheck
        run: npm -w backend run typecheck
      # 守：数据核对不通过不出股数；顺序 C 级清退 → 单票归位 → 熔断；熔断待核验不进执行列表也不消失；
      # 决策输入只由账本和持仓价格算出；主线外持仓只提示、不出指令。
      - name: Daily decision selftest (执行单)
        run: npm -w backend run decision:daily:selftest
      # 守：认不出的文字不猜；识别结果必须过勾稽核对；图片不经确认不生效；成交不改账本。
      - name: Intake selftest (输入框)
        run: npm -w backend run intake:selftest
      # 生产分支上已经发出的执行单，现在的代码必须逐字重现。
      # 有意修改执行单版式时这一步会失败，那时须在 PR 里写明改了什么。
      - name: Historical card regression (历史执行单逐字重现)
        run: |
          git fetch --no-tags origin cursor/account-snapshot-1009-c819
          npm -w backend run decision:regress -- FETCH_HEAD
      # 打印规则指纹并与基线比对。变动时不失败，变动只需在基线文件的 git diff 里显形。
      - name: Rule freeze check (规则指纹)
        run: npm -w backend run freeze:check
      - name: Source lint (变量花括号 + 严格模式 + 界面文案无 Markdown 星号)
        run: node scripts/lint-source.mjs
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-20-${{ hashFiles('package-lock.json') }}
      - name: Install (workspaces)
        run: npm ci --no-audit --progress=false
      - name: Typecheck
        run: npm -w frontend run typecheck
      - name: Build
        run: npm -w frontend run build
